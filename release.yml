name: Release

# Tag push (v0.1.0)       -> build everything, test every wheel, publish to PyPI
# "Run workflow" button   -> same build, publish to TestPyPI (dry run)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF2'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} does not match pyproject version {version}"
          print("tag matches version", version)
          EOF2
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Emulation for the Linux aarch64 wheels
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      # configuration (Python version, architectures, tests) lives in pyproject.toml, [tool.cibuildwheel]
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write          # trusted publishing: no password or token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Files to upload
        run: ls -l dist
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
